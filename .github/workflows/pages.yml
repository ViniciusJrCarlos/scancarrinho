name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou commit para publicar (ex.: v0.1.0). Vazio = main."
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/configure-pages@v5
      - name: Montar site (sem docs/ e arquivos de projeto)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js favicon.ico .nojekyll css js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
