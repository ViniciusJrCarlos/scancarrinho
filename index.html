<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>ScanCarrinho</title>
  <meta name="description" content="Calcule o total da compra no supermercado escaneando o carrinho. Funciona offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2E7D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ScanCarrinho">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-voltar" class="icon-btn" type="button" aria-label="Voltar" hidden></button>
    <h1 id="titulo">ScanCarrinho</h1>
    <button id="btn-instalar" class="chip" type="button" hidden>Instalar</button>
  </header>
  <main id="view" tabindex="-1"><p class="carregando">Carregando…</p></main>
  <nav class="tabs" id="tabs" aria-label="Navegação principal">
    <a href="#/scan" data-tab="scan"><span class="tab-ico" data-icon="scan"></span><span>Escanear</span></a>
    <a href="#/lista" data-tab="lista"><span class="tab-ico" data-icon="cart"></span><span>Lista</span><span class="badge" id="badge" hidden></span></a>
    <a href="#/resumo" data-tab="resumo"><span class="tab-ico" data-icon="receipt"></span><span>Resumo</span></a>
  </nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Ative o JavaScript para usar o ScanCarrinho.</p></noscript>
  <script type="module" src="js/boot.js"></script>
</body>
</html>
